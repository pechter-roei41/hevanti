# Hevanti on a real Mac (Apple Silicon), the way a student uses it: the Mac ZIP, Install.command, BlackHole,
# Hevanti.command, a course, a live Hebrew lecture played into BlackHole, the transcript, and the AI connector.
# The results table is on the run's page (Summary); the screenshot, slide and log are under "Artifacts".
name: mac-test
on:
  push:
    branches: [main]
    paths: ["System/**", "Install.command", "Hevanti.command", "tools/**", ".github/workflows/mac-test.yml"]
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The Mac ZIP, unzipped like a student does
        run: |
          python3 tools/build_zip.py --mac Hevanti-Mac.zip
          mkdir -p "$RUNNER_TEMP/student" && cd "$RUNNER_TEMP/student" && unzip -q "$GITHUB_WORKSPACE/Hevanti-Mac.zip"
      - name: BlackHole (the free sound driver the README asks for) and a way to pick the output
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          sleep 5
          SwitchAudioSource -a -t output
      - name: Install.command (Python, packages, slide reading)
        run: yes | "$RUNNER_TEMP/student/Hevanti_v2.0/Install.command"
      - name: Use it
        run: python3 tools/mac_smoke.py "$RUNNER_TEMP/student/Hevanti_v2.0" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-results
          path: ${{ runner.temp }}/results
