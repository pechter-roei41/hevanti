# Quick tests on every push, on Windows (what students use) and Linux: the AI connector, the AI of each course
# (course files, project links, the cloud copy, Gemini's config) and where the YouTube player is photographed.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pillow
      - name: The AI connector
        run: python tools/test_mcp.py
      - name: The AI of each course
        run: python tools/test_course_ai.py
      - name: Photographing the YouTube player
        run: python tools/test_youtube_rect.py
      - name: Stopping a lecture right after starting it
        run: python tools/test_stop.py
