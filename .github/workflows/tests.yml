# Quick tests on every push, on Windows (what students use) and Linux: the AI connector, the AI of each course
# (course files, project links, the cloud copy, Gemini's config) and where the YouTube player is photographed.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pillow
      - name: Playwright (the browser tests run on Windows, where Edge is installed)
        if: runner.os == 'Windows'
        run: python -m pip install playwright
      - name: The core - the marks, the settings the floating window relies on
        run: python tools/test_core.py
      - name: The core in a browser - the marks tab, the consent, the ask box, the floating window
        if: runner.os == 'Windows'
        run: python tools/test_core_ui.py
      - name: Design round 3 - one green on the home page, the selected shapes, the lecture menu, the split settings (browser)
        if: runner.os == 'Windows'
        run: python tools/test_design3.py
      - name: Nothing scrolls sideways at 320 px, and the focus ring of the floating window (browser)
        if: runner.os == 'Windows'
        run: python tools/test_narrow.py
      - name: The question to Gemini, from the sound to the answer - a model that fails, the quota, what is kept (made-up Gemini)
        run: python tools/test_ai_flow.py
      - name: The page offers the student's own AI apps when the quota is used up (browser, made-up Gemini)
        if: runner.os == 'Windows'
        run: python tools/test_ai_flow_ui.py
      - name: Saving the settings and the key - whole or not at all, a damaged file, two threads at once, no key without encryption
        run: python tools/test_settings.py
      - name: The connection to Gemini - every error Google gives, a stream that stops, is cut or is slow, at most two models for a live question
        run: python tools/test_gemini.py
      - name: Colours - the pages use the tokens of DESIGN.md, and every colour pair keeps its contrast (computed)
        run: python tools/test_contrast.py
      - name: The AI connector
        run: python tools/test_mcp.py
      - name: The AI of each course
        run: python tools/test_course_ai.py
      - name: The free quota and the paid-plan question
        run: python tools/test_quota.py
      - name: Photographing the YouTube player
        run: python tools/test_youtube_rect.py
      - name: Stopping a lecture right after starting it
        run: python tools/test_stop.py
      - name: Recordings from Panopto
        run: python tools/test_panopto.py
      - name: The live lecture loop - what is cut, written and kept; the device that disconnects; falling behind; the GPU (no model, no sound card)
        run: python tools/test_live_loop.py
      - name: Reading a recording with a new PyAV
        run: |
          python -m pip install av faster-whisper
          python tools/test_av.py
      - name: A recorded lecture - blocks, the watched part first, silence, the player's state and page (no model)
        run: python tools/test_recording.py
      - name: Which course is the lecture about to start - from a window's title or the weekly schedule
        run: python tools/test_course_guess.py
      - name: Slides and questions - only stable slides, a picture when a question begins, "what I missed" (3, 7, 15 minutes)
        run: python tools/test_slides.py
