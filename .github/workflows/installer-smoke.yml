# Builds Hevanti-Setup.exe exactly as release.yml does, but publishes nothing: installs it on a clean Windows machine,
# starts the program with its own Python, checks that the pages are served, and uninstalls it.
# Runs when the installer, its build or the smoke test change (and by hand: Actions > installer-smoke > Run workflow).
# Keep the build steps the same as in release.yml (job "setup").
name: installer-smoke
on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "tools/build_setup_dir.py"
      - "tools/smoke_install.ps1"
      - "tools/smoke_server.py"
      - ".github/workflows/installer-smoke.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: The folder to install (app + Hevanti's own Python + icon)
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -OutFile embed.zip
          Invoke-WebRequest -UseBasicParsing https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          python tools/build_setup_dir.py embed.zip get-pip.py build/app
      - name: The packages, already inside
        shell: pwsh
        run: |
          $py = "build/app/python/python.exe"
          & $py build/app/python/get-pip.py --no-warn-script-location
          & $py -m pip install -r System/requirements.txt --require-hashes --only-binary=:all: --no-warn-script-location
          Remove-Item build/app/python/get-pip.py
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path System/Program/live_transcribe.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" "/DSrc=..\build\app" installer\hevanti.iss
          if (-not (Test-Path dist/Hevanti-Setup.exe)) { throw "no setup" }
      - name: Smoke test - install, start, uninstall
        shell: pwsh
        run: ./tools/smoke_install.ps1 dist/Hevanti-Setup.exe
