<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הבנתי</title>
<!-- Hevanti (הבנתי) - the small question window (always on top, opened with Ctrl+Alt+Q) - (c) 2026 Roei Pechter. MIT License, see LICENSE.txt -->
<style>
/* the two fonts of the app come with the program (System/Program/fonts, SIL Open Font License): nothing is loaded from the internet */
@font-face{font-family:"Secular One";src:url("/fonts/SecularOne-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Assistant";src:url("/fonts/Assistant-Variable.ttf") format("truetype");font-weight:200 800;font-style:normal;font-display:swap}
</style>
<style>
:root{
  --bg:#F6F3E9; --surface:#FFFFFF; --sunk:#ECE7D8; --fg:#17261F; --muted:#56625B; --line:#DDD7C4;
  --accent:#1F7A55; --accent-ink:#FFFFFF; --accent-soft:#DCEBDF; --rec:#C2412D; --warn-bg:#FBF0DA; --warn-fg:#6B5020;
  --f-body:"Assistant","Segoe UI","Arial Hebrew",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121C17; --surface:#1A2620; --sunk:#22302A; --fg:#E8EFE9; --muted:#9FB0A6; --line:#2E3D35;
  --accent:#5BC79A; --accent-ink:#0E1A14; --accent-soft:#1F3A2E; --rec:#FF7A63; --warn-bg:#3A3122; --warn-fg:#EBD08E; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;display:flex;flex-direction:column}
button,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
header b{font-size:15px}
#lec{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:700;color:var(--fg)}
.hb{border:1px solid var(--line);background:none;border-radius:8px;padding:1px 10px;cursor:pointer;font-size:15px;line-height:1.4}
.hb:hover{background:var(--accent-soft)}
.miss{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px 0;font-size:13px;color:var(--muted)}
.miss button{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:1px 11px;cursor:pointer;font-size:13px;font-weight:600}
.miss button:hover{background:var(--accent-soft)}
#note{margin:8px 10px 0;padding:6px 10px;border-radius:10px;background:var(--warn-bg);color:var(--warn-fg);font-size:13px}
#box{flex:1;min-height:0;padding:8px 10px 10px}
#box.askp{display:flex;flex-direction:column;height:100%;gap:8px}
#box.askp .conv{flex:1;min-height:0;max-height:none}
#box.askp .head{display:none}
#box.askp textarea{font-size:16px}
#toast{position:fixed;inset-inline:10px;bottom:10px;background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <span id="lec">אין עכשיו הרצאה פעילה</span>
 <button class="hb" id="markImp" type="button" title="סימון ★ של הרגע הזה (Ctrl+Alt+M)" aria-label="סימון ★ של הרגע הזה">★</button>
 <button class="hb" id="hide" type="button" title="להסתיר (Ctrl+Alt+Q או Esc)" aria-label="להסתיר">—</button>
</header>
<div id="note" hidden>אין עכשיו הרצאה פעילה. מתחילים הרצאה או פותחים הקלטה באפליקציה, ואז אפשר לשאול כאן.</div>
<div class="miss" id="miss" role="group" aria-label="מה פספסתי" hidden>
  <span>מה פספסתי:</span>
  <button type="button" data-m="3" title="סיכום של 3 הדקות האחרונות">3 דק'</button>
  <button type="button" data-m="7" title="סיכום של 7 הדקות האחרונות">7 דק'</button>
  <button type="button" data-m="15" title="סיכום של 15 הדקות האחרונות">15 דק'</button>
</div>
<div id="box"></div>
<div id="toast" role="status"></div>
<script src="/ask.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
let shot = null, total = 0, live = false, kind0 = "";
function toast(t) {
  const e = $("#toast"); e.textContent = t; e.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("on"), Math.max(2800, t.length * 50));
}
const hide = () => fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"},
  body: JSON.stringify({action: "hide_mini"})}).catch(() => {});
$("#hide").addEventListener("click", hide);
// mark this moment of the lecture with ★ (the course page then lists it)
async function mark() {
  let r; try { r = await (await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"},
    body: JSON.stringify({action: "mark", kind: "important"})})).json(); } catch (e) { r = {ok: false}; }
  toast(r.ok ? "★ סומן" : (r.error || "לא הצלחתי לסמן."));
}
$("#markImp").addEventListener("click", () => mark());
let box = null;
if (window.BZMAsk) box = BZMAsk.mount($("#box"), {compact: true, title: "שאלה", placeholder: "מה לא ברור? (Enter לשליחה)",
  context: q => q, toast, hasImage: () => !!shot, image: () => shot, where: () => "mini",
  at: () => new Date().toLocaleTimeString("he-IL")});
// "what I missed": a ready question about the last 3 / 7 / 15 minutes (Hevanti sends them with it; see missed_question)
for (const b of document.querySelectorAll("#miss button")) b.addEventListener("click", () => {
  const n = +b.dataset.m;
  if (box) box.ask("פספסתי את " + n + " הדקות האחרונות של ההרצאה. תסכם לי מה נאמר בהן ומה חשוב להבין כדי להמשיך לעקוב.",
    {title: "מה פספסתי ב-" + n + " הדקות האחרונות?", minutes: n});
});
document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
window.addEventListener("focus", () => { if (box) box.focus(); });
async function getJson(u) { return (await fetch(u, {cache: "no-store"})).json(); }
async function pollApp() {
  try {
    const d = await getJson("/api/app"), s = d.session;
    live = !!(s && !s.done && (s.kind === "live" || s.kind === "rec"));   // a live lecture, a video, or a recording being watched
    // "הרצאה חיה - <the course>", e.g. "הרצאה חיה - מכניקת מוצקים"
    const kind = live ? (s.kind === "rec" ? "הרצאה מוקלטת" : s.yt ? "סרטון יוטיוב" : "הרצאה חיה") : "";
    $("#lec").textContent = live ? kind + (s.course && s.course !== "ללא קורס" ? " - " + s.course : "") : "אין עכשיו הרצאה פעילה";
    kind0 = s ? s.kind : "";
    $("#note").hidden = live;
    $("#miss").hidden = !live;
    if (window.BZMAsk) {
      BZMAsk.setConnected(d.connect); BZMAsk.setApps(d.ai_apps);
      BZMAsk.setBuiltin(!!(d.math && d.math.ask)); BZMAsk.setPlan((d.math && d.math.plan) || ""); BZMAsk.setExternal(!!(d.math && d.math.external));
    }
  } catch (e) {}
}
async function pollLive() {
  if (!live || kind0 === "rec") { shot = null; total = 0; return; }   // (a recording: the server finds the slide)
  try {
    const d = await getJson("/api/live?since=" + total);
    if (d.none) { shot = null; total = 0; return; }
    if (d.yt) { const im = (d.items || []).filter(x => x.img).pop(); if (im) shot = im.img; }
    else { total = d.total || total; if (d.shot) shot = d.shot; }
  } catch (e) {}
}
pollApp(); setInterval(pollApp, 4000);
setInterval(pollLive, 3000);
if (box) box.focus();
</script>
</body>
</html>
