<style>
:root{
  --bg:#F6F3E9; --surface:#FFFFFF; --sunk:#ECE7D8; --fg:#17261F; --muted:#56625B; --line:#DDD7C4;
  --accent:#1B6E4B; --accent-ink:#FFFFFF; --accent-soft:#DCEBDF; --rec:#C2412D; --warn-bg:#FBF0DA; --warn-fg:#6B5020; --mark-line:#F7DD7B;
  --f-body:"Assistant","Segoe UI","Arial Hebrew",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1B16; --surface:#26241D; --sunk:#2F2C23; --fg:#F1ECDF; --muted:#B5AFA0; --line:#3E3A2E;
  --accent:#5BC79A; --accent-ink:#0E1A14; --accent-soft:#25382B; --rec:#FF7A63; --warn-bg:#3A3122; --warn-fg:#EBD08E; --mark-line:#594E25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1B16; --surface:#26241D; --sunk:#2F2C23; --fg:#F1ECDF; --muted:#B5AFA0; --line:#3E3A2E;
  --accent:#5BC79A; --accent-ink:#0E1A14; --accent-soft:#25382B; --rec:#FF7A63; --warn-bg:#3A3122; --warn-fg:#EBD08E; --mark-line:#594E25; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;display:flex;flex-direction:column}
button,textarea{font:inherit;color:inherit}
textarea:placeholder-shown,input:not([dir="ltr"]):not([type=password]):not([type=checkbox]):not([type=radio]):placeholder-shown{direction:rtl;text-align:right}
/* the placeholder is ink-muted (DESIGN.md), never the browser's own grey (#757575: 3.74:1 on the dark paper): 5.74:1 by day, 7.89:1 at night on paper */
::placeholder{color:var(--muted);opacity:1}

[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
header b{font-size:15px}
#lec{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
#lec::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
body.on #lec{color:var(--fg)}
body.on #lec::before{background:var(--rec)}
@media (prefers-reduced-motion:no-preference){body.on #lec::before{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}
.hb{flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:none;border-radius:10px;padding:0;cursor:pointer;font-size:16px;line-height:1}
.hb:hover{background:var(--accent-soft)}
.hb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}   /* DESIGN.md: focus is a 2px green outline with a 2px offset; the answer button had only the browser's thin default */
#markImp{color:var(--accent);border-color:var(--accent)}
.miss{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px 0;font-size:13px;color:var(--muted)}
.miss button{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:1px 11px;cursor:pointer;font-size:13px;font-weight:600}
.miss button:hover{background:var(--accent-soft)}
#lag{flex:none;padding:2px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn-fg);font-size:13px;line-height:1.5;font-weight:700;white-space:nowrap;align-self:center}   /* in the row of "תשובה כאן", a caution pill: never green */
#stopBtn{padding:0 12px;width:auto;font-size:14px;font-weight:600}
#stopBtn.confirm{border-color:var(--rec);color:var(--rec);font-weight:800}
footer{flex:none;display:flex;justify-content:flex-start;padding:2px 10px 8px}
#quitBtn{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;min-height:28px;padding:2px 6px;border-radius:8px;cursor:pointer;text-decoration:underline}
#quitBtn.confirm{color:var(--rec);font-weight:800;text-decoration:none}
#short{margin:14px 10px;padding:18px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
#short b{font-size:18px}
#short p{margin:0;color:var(--muted);font-size:15px}
#short button{border:1.5px solid var(--line);background:none;color:var(--fg);border-radius:12px;padding:8px 14px;min-height:40px;font-size:15px;font-weight:600;cursor:pointer}
#short button:hover{background:var(--accent-soft)}
#saved{margin:14px 10px;padding:18px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
#saved .tick{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px;font-weight:800}
#saved b{font-size:18px}
#saved p{margin:0;color:var(--muted);font-size:15px}
#saved button{border:1.5px solid var(--accent);background:none;color:var(--accent);border-radius:12px;padding:8px 14px;min-height:40px;font-size:15px;font-weight:600;cursor:pointer}
#saved button:hover{background:var(--accent-soft)}
#sug{margin:8px 10px 0;padding:8px 10px;border-radius:10px;background:var(--sunk);color:var(--fg);font-size:14px;line-height:1.45;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#sug span{flex:1 1 150px}
#sug button{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:2px 12px;min-height:28px;cursor:pointer;font-size:13px;font-weight:600}
#sug button:hover{background:var(--accent-soft)}
#note{margin:8px 10px 0;padding:6px 10px;border-radius:10px;background:var(--sunk);color:var(--muted);font-size:13.5px;line-height:1.45}
.miss button{padding:3px 12px;min-height:28px}
#box{flex:1;min-height:0;padding:8px 10px 10px}
#box.askp{display:flex;flex-direction:column;height:100%;gap:8px}
#box.askp .conv{flex:1;min-height:0;max-height:none}
#box.askp .head{display:none}
#box.askp textarea{font-size:17px;padding:10px 12px;min-height:3.6em;border-radius:12px}
#box.askp .ais button.here{padding:8px 18px;font-size:15px;border-radius:12px;margin-inline-start:auto}
#toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 20px);width:max-content;box-sizing:border-box;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18);padding:9px 16px;border-radius:12px;font-size:15px;line-height:1.4;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast .star{display:inline-block;background:var(--mark-line);color:var(--fg);border-radius:6px;padding:0 7px;margin-inline-end:8px}   /* the ★ is the only yellow: the highlighter of a mark */
#toast.on{opacity:1}
/* motion (2.22): short and quiet; the system setting and the app's "no animations and motion" turn it off */
#saved .tick svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){
  #toast.on .star{animation:hv-pop .5s cubic-bezier(.2,.8,.2,1) .05s backwards}
  #saved:not([hidden]) .tick{animation:hv-pop .45s cubic-bezier(.2,.8,.2,1) backwards}
  #saved:not([hidden]) .tick path{stroke-dasharray:24;animation:hv-draw .4s cubic-bezier(.2,.8,.2,1) .18s backwards}
}
@keyframes hv-pop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes hv-draw{from{stroke-dashoffset:24}}
html.a-read body{line-height:1.9;letter-spacing:.015em;word-spacing:.14em}
html.a-contrast{--muted:var(--fg);--line:#7d7d7d}
html.a-contrast :focus-visible{outline:3px solid var(--fg)!important;outline-offset:2px}
html.a-still *,html.a-still *::before,html.a-still *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<header>
  <span id="lec">אין עכשיו הרצאה פעילה</span>
 <button class="hb" id="stopBtn" type="button" hidden title="עצירת ההקלטה: ההרצאה נשמרת">עצירה</button>
 <button class="hb" id="markImp" type="button" title="סימון ★ של הרגע הזה (Ctrl+Alt+M)" aria-label="סימון ★ של הרגע הזה">★</button>
</header>
<div id="short" role="alertdialog" aria-labelledby="shortT" hidden>
  <b id="shortT">עצרת מיד אחרי שהתחלת</b><p id="shortInfo"></p>
  <button type="button" id="shortDel">עצירה ומחיקה</button><button type="button" id="shortSave">לעצור ולשמור</button>
</div>
<div id="saved" role="status" hidden>
  <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5.5 12.8l4.3 4.3L18.5 7.4"/></svg></div><b>ההרצאה נשמרה בהצלחה</b><p id="savedInfo"></p>
  <button type="button" id="savedOpen">פתיחת ההרצאה באפליקציה</button><button type="button" id="savedClose">סגירה</button>
</div>

<div id="note" hidden>אין עכשיו הרצאה פעילה. מתחילים הרצאה או פותחים הקלטה באפליקציה, ואז אפשר לשאול כאן.</div>
<div class="miss" id="miss" role="group" aria-label="מה פספסתי" hidden>
  <span>מה פספסתי:</span>
  <button type="button" data-m="3" title="סיכום של 3 הדקות האחרונות">3 דק'</button>
  <button type="button" data-m="7" title="סיכום של 7 הדקות האחרונות">7 דק'</button>
  <button type="button" data-m="15" title="סיכום של 15 הדקות האחרונות">15 דק'</button>
</div>
<div id="box"></div>
<footer><button type="button" id="quitBtn" title="סוגר את הבנתי לגמרי: הכפתור הצף, החלון הזה והאפליקציה. הרצאה שרצה נשמרת.">סגירת הבנתי</button></footer>
<div id="toast" role="status"></div>
<script src="/ask.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
let shot = null, total = 0, live = false, kind0 = "", lastMark = null, sawLive = false, savedFor = null, savedGone = "", stopTimer = 0, curS = null;
const MARKED = "★ סומן";
function toast(t) {
  const e = $("#toast"); e.textContent = "";
  if (t === MARKED) { const s = document.createElement("span"); s.className = "star"; s.textContent = "★"; e.append(s, "סומן"); }   // the mark: a yellow ★ and the word, one line
  else e.textContent = t;
  e.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("on"), Math.max(2800, t.length * 50));
}
const hide = () => fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"},
  body: JSON.stringify({action: "hide_mini"})}).catch(() => {});
// mark this moment of the lecture with ★ (the course page then lists it)
async function mark() {
  let r; try { r = await (await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"},
    body: JSON.stringify({action: "mark", kind: "important"})})).json(); } catch (e) { r = {ok: false}; }
  markedHere = !!r.ok;   // (the next look at the counter must not say it twice)
  toast(r.ok ? MARKED : (r.error || "לא הצלחתי לסמן."));
}
$("#markImp").addEventListener("click", () => mark());
// stop from here: the first press asks (3 seconds), the second stops; the lecture is saved, and a card says so
const stopBtn = $("#stopBtn");
function stopReset() { clearTimeout(stopTimer); stopBtn.classList.remove("confirm"); stopBtn.textContent = "עצירה"; }
stopBtn.addEventListener("click", async () => {
  if (stopBtn.dataset.mode === "start") {   // no lecture: the same place starts a new one (the quick-start window; closing it closes only itself)
    try { await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "quick_new"})}); } catch (e) {}
    return;
  }
  if (!stopBtn.classList.contains("confirm")) {
    stopBtn.classList.add("confirm"); stopBtn.textContent = "לעצור?";
    stopTimer = setTimeout(stopReset, 3000);
    return;
  }
  stopReset();
  const sk = BZMAsk.stopKind(curS);   // (the same rule as in the app: ask.js)
  if (sk.kind === "cancel") { await doStop(true); toast("בוטל. לא נשמר כלום."); return; }
  if (sk.kind === "short") {   // almost empty: the same question as in the app
    $("#shortInfo").textContent = "עברו רק " + Math.max(1, Math.round(sk.secs)) + " שניות, אז כמעט אין בה כלום. למחוק אותה?";
    $("#short").hidden = false; stopBtn.hidden = true; $("#shortSave").focus();
    return;
  }
  await doStop(false);
});
let discardedHere = false;   // (the student chose to delete it: no "saved" card for this lecture, whatever the server says)
async function doStop(discard) {
  discardedHere = !!discard;
  $("#short").hidden = true; stopBtn.hidden = true;
  $("#lec").textContent = discard ? "עוצר ומוחק..." : "עוצר ושומר...";
  try { await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "stop", discard})}); } catch (e) {}
  pollApp();
}
$("#shortDel").addEventListener("click", async () => { await doStop(true); toast("ההרצאה נעצרה ונמחקה."); });
$("#shortSave").addEventListener("click", () => doStop(false));
// close Hevanti for good, from here: the first press asks (3 seconds), the second closes (a running lecture is stopped and saved first)
const quitBtn = $("#quitBtn"); let quitTimer = 0;
quitBtn.addEventListener("click", async () => {
  if (!quitBtn.classList.contains("confirm")) {
    quitBtn.classList.add("confirm"); quitBtn.textContent = live ? "לסגור? ההרצאה תישמר" : "לסגור את הבנתי?";
    quitTimer = setTimeout(() => { quitBtn.classList.remove("confirm"); quitBtn.textContent = "סגירת הבנתי"; }, 3000);
    return;
  }
  clearTimeout(quitTimer); quitBtn.disabled = true; quitBtn.textContent = live ? "שומר וסוגר..." : "סוגר...";
  try { await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "quit"})}); } catch (e) {}
});
$("#savedClose").addEventListener("click", () => { savedGone = $("#saved").dataset.f || ""; drawSaved(null); hide(); });
$("#savedOpen").addEventListener("click", async () => {
  const f = $("#saved").dataset.f; savedGone = f || ""; drawSaved(null);
  try { await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "open_lecture", f})}); } catch (e) {}
  hide();
});
function drawSaved(s) {   // the lecture this window saw running is saved: a card instead of the question box
  let sv = s && s.done && s.saved && sawLive && !discardedHere ? s.saved : null;
  if (sv && sv.f === savedGone) sv = null;   // (closed or opened already: it does not come back every time the window opens)
  if (sv && savedFor !== sv.f) savedFor = sv.f;
  const show = !!sv && savedFor === sv.f && !live;
  $("#saved").hidden = !show;
  if (show) {
    $("#saved").dataset.f = sv.f;
    $("#savedInfo").textContent = (sv.course && sv.course !== "ללא קורס" ? "בקורס \"" + sv.course + "\", " : "") + sv.minutes + " דקות, " + sv.slides + (sv.slides === 1 ? " שקף" : " שקפים") + ".";
    $("#note").hidden = true; $("#miss").hidden = true; $("#sug").hidden = true; $("#box").hidden = true;
  } else { $("#box").hidden = false; }
}
$("#sugYes").addEventListener("click", async () => {   // the lecture moves to that course when it is stopped and saved
  const c = $("#sug").dataset.course; $("#sug").hidden = true;
  let r; try { r = await (await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "set_lecture_course", course: c})})).json(); } catch (e) { r = {ok: false}; }
  toast(r.ok ? "ההרצאה תועבר לקורס \"" + c + "\" כשתיעצר ותישמר." : (r.error || "לא הצלחתי להעביר."));
});
$("#sugNo").addEventListener("click", () => { $("#sug").hidden = true; fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "suggest_dismiss"})}).catch(() => {}); });
let box = null, markedHere = false, lastKey = "";
if (window.BZMAsk) box = BZMAsk.mount($("#box"), {compact: true, title: "שאלה", placeholder: "מה לא ברור? (Enter לשליחה)",
  context: q => q,   // (for "answer here" Hevanti builds the context itself)
  // what is copied to ChatGPT / Gemini / Claude: the question with the last minutes of the lecture, built by Hevanti like the page's own
  copyContext: async (q, minutes) => {   // (when Hevanti cannot answer, this throws and the bare question is copied: a copy never fails for that)
    const r = await fetch("/api/mini_context", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"},
      body: JSON.stringify({question: q, minutes: minutes || 0}), signal: AbortSignal.timeout(8000)});
    const d = await r.json();
    if (!r.ok || typeof d.context !== "string" || !d.context) throw new Error("no context");
    return d.context;
  },
  toast, hasImage: () => !!shot, image: () => shot, where: () => "mini",
  at: () => new Date().toLocaleTimeString("he-IL")});
// "what I missed": a ready question about the last 3 / 7 / 15 minutes (Hevanti sends them with it; see missed_question)
for (const b of document.querySelectorAll("#miss button")) b.addEventListener("click", () => {
  const n = +b.dataset.m;
  if (box) box.ask("פספסתי את " + n + " הדקות האחרונות של ההרצאה. תסכם לי מה נאמר בהן ומה חשוב להבין כדי להמשיך לעקוב.",
    {title: "מה פספסתי ב-" + n + " הדקות האחרונות?", minutes: n});
});
document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
window.addEventListener("focus", () => { if (box) box.focus(); });
async function getJson(u) { return (await fetch(u, {cache: "no-store"})).json(); }
async function pollApp() {
  try {
    const d = await getJson("/api/app"), s = d.session;
    if (d.save_failed && d.save_failed.n !== lastSaveFail) { lastSaveFail = d.save_failed.n; toast(d.save_failed.msg); }   // (a settings save that failed: said once)
    const mine = (document.querySelector('meta[name="bzm-run"]') || {}).content;   // a window left open from an earlier run of Hevanti has the old page: it loads the new one
    if (d.run && mine && mine !== "__" + "RUN__" && mine !== d.run) {
      let again = true;   // (never more often than every 20 seconds: a mismatch that does not go away must not make the window reload without end)
      try { again = Date.now() - (+sessionStorage.getItem("bzm.reload") || 0) > 20000; if (again) sessionStorage.setItem("bzm.reload", Date.now()); } catch (e) {}
      if (again) { location.reload(); return; }
    }
    if (typeof d.mark_n === "number") {   // a mark made with Ctrl+Alt+M (or in the app): said here too, as a click on ★ here says it
      if (lastMark !== null && d.mark_n > lastMark && !markedHere) toast(MARKED);
      lastMark = d.mark_n; markedHere = false;
    }
    if ("theme" in d && (d.theme || "") !== (document.documentElement.dataset.theme || "")) bzmTheme(d.theme || "");
    if (d.a11y) a11yView(d.a11y);
    if ("still" in d) document.documentElement.classList.toggle("a-still", !!d.still);   // "no animations and motion" in the app reaches this window too
    live = !!(s && !s.done && (s.kind === "live" || s.kind === "rec"));   // a live lecture, a video, or a recording being watched
    // "הרצאה חיה - <the course>", e.g. "הרצאה חיה - מכניקת מוצקים"
    const kind = live ? (s.kind === "rec" ? "הרצאה מוקלטת" : s.yt ? "סרטון יוטיוב" : "הרצאה חיה") : "";
    $("#lec").textContent = live ? kind + (s.course && s.course !== "ללא קורס" ? " - " + s.course : "") + (s.ready ? "" : " · מתחילה...") : "אין עכשיו הרצאה פעילה";   // (the button is there from the first second; the transcript starts when the model has loaded)
    kind0 = s ? s.kind : "";
    $("#note").hidden = live; document.body.classList.toggle("on", live);
    if (live) { sawLive = true; if (!s.stopping) discardedHere = false; }
    curS = s;
    const key = s && !s.done ? s.started + "|" + s.kind : "";   // a new lecture starts a new conversation (the window stays open from lecture to lecture)
    if (key && key !== lastKey) { if (lastKey && box) box.reset(); lastKey = key; }
    const canStop = live && s && s.kind === "live" && !s.stopping;   // (a recording watched in the player is not stopped from here)
    if (!live && stopTimer) stopReset();
    if (!live) $("#short").hidden = true;
    // with no lecture the same button starts a new one; while a lecture stops, a recording is watched, or the question "delete?" is open, it is hidden
    const startNew = !live && !(s && !s.done);
    stopBtn.dataset.mode = startNew ? "start" : "stop";
    if (startNew) { stopBtn.textContent = "התחלת הרצאה חדשה"; stopBtn.title = "פותח את חלון ההתחלה המהירה"; stopBtn.classList.remove("confirm"); }
    else if (!stopBtn.classList.contains("confirm")) { stopBtn.textContent = "עצירה"; stopBtn.title = "עצירת ההקלטה: ההרצאה נשמרת"; }
    stopBtn.hidden = !(canStop || startNew) || !$("#short").hidden;
    if (live && s && s.stopping) $("#lec").textContent = (s.discard ? "עוצר ומוחק..." : "עוצר ושומר...") + (s.stopping_for > 5 ? " " + s.stopping_for + " שנ'" : "");
    const sg = live && s && s.suggest;   // a course read from the first slide: offered, one press to take it
    $("#sug").hidden = !sg;
    if (sg) { $("#sugText").textContent = "נראה שזה הקורס \"" + sg.course + "\" (לפי השקף הראשון). להעביר?"; $("#sug").dataset.course = sg.course; }
    $("#miss").hidden = !live;
    drawSaved(s);
    if (window.BZMAsk) {
      BZMAsk.setConnected(d.connect); BZMAsk.setApps(d.ai_apps);
      BZMAsk.setBuiltin(!!(d.math && d.math.ask)); BZMAsk.setPlan((d.math && d.math.plan) || ""); BZMAsk.setExternal(!!(d.math && d.math.external));
    }
  } catch (e) {}
}
// the warning that the transcript is behind sits in the row of "תשובה כאן" (where one decides to ask), not in the title row, which a long course name needs.
// The ask box can build its row again: the chip is put back in the current one.
function lagChip() {
  let c = document.getElementById("lag");
  if (!c) { c = document.createElement("span"); c.id = "lag"; c.setAttribute("role", "status"); c.hidden = true; }
  const row = document.querySelector("#box .ais");
  if (row && c.parentElement !== row) row.appendChild(c);
  return c;
}
async function pollLive() {
  if (!live || kind0 === "rec") { shot = null; total = 0; lagChip().hidden = true; return; }   // (a recording: the server finds the slide)
  try {
    const d = await getJson("/api/live?since=" + total);
    if (d.none) { shot = null; total = 0; lagChip().hidden = true; return; }
    // the transcript is behind what is being said: always shown over 10 seconds (the answers rest on what was already written)
    const lag = Math.round(d.lag || 0), lagBox = lagChip();
    lagBox.hidden = !(lag > LAG_SHOW_S);
    if (!lagBox.hidden) {
      lagBox.textContent = "מאחר ב-" + lag + " שניות";
      lagBox.title = lagBox.dataset.full = "התמלול מאחר ב-" + lag + " שניות. התשובות מבוססות על מה שכבר נכתב.";
      lagBox.setAttribute("aria-label", lagBox.title);
    }
    if (d.yt) { const im = (d.items || []).filter(x => x.img).pop(); if (im) shot = im.img; }
    else { total = d.total || total; if (d.shot) shot = d.shot; }
  } catch (e) {}
}
const LAG_SHOW_S = 10;
let lastSaveFail = null;
pollApp(); setInterval(pollApp, 4000);
// light/dark and "no motion" follow the app within a second: a tiny request of its own, apart from the slower full poll above
function a11yView(v) {   // text size, reading spacing and contrast chosen in the app (this window has its own browser profile, so the tool passes them)
  if (!v) return; const r = document.documentElement;
  r.classList.toggle("a-read", !!v.read); r.classList.toggle("a-contrast", !!v.contrast);
  r.style.zoom = v.tx > 1 ? String(Math.min(+v.tx, 1.4)) : "";
}
async function pollTheme() { try { const d = await getJson("/api/theme"); if ((d.theme || "") !== (document.documentElement.dataset.theme || "")) bzmTheme(d.theme || ""); document.documentElement.classList.toggle("a-still", !!d.still); if (d.a11y) a11yView(d.a11y); } catch (e) {} }
setInterval(pollTheme, 1000);
setInterval(pollLive, 3000);
if (box) box.focus();
</script>
</body>
</html>
