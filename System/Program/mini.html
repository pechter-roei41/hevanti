<style>
/* the two fonts of the app come with the program (System/Program/fonts, SIL Open Font License): nothing is loaded from the internet */
@font-face{font-family:"Secular One";src:url("/fonts/SecularOne-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Assistant";src:url("/fonts/Assistant-Variable.ttf") format("truetype");font-weight:200 800;font-style:normal;font-display:swap}

<style>
:root{
  --bg:#F6F3E9; --surface:#FFFFFF; --sunk:#ECE7D8; --fg:#17261F; --muted:#56625B; --line:#DDD7C4;
  --accent:#1B6E4B; --accent-ink:#FFFFFF; --accent-soft:#DCEBDF; --mark:#F7D44C; --rec:#C2412D; --warn-bg:#FBF0DA; --warn-fg:#6B5020; --mark-line:#F7DD7B;
  --f-body:"Assistant","Segoe UI","Arial Hebrew",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1B16; --surface:#26241D; --sunk:#2F2C23; --fg:#F1ECDF; --muted:#B5AFA0; --line:#3E3A2E;
  --accent:#5BC79A; --accent-ink:#0E1A14; --accent-soft:#25382B; --mark:#E8C547; --rec:#FF7A63; --warn-bg:#3A3122; --warn-fg:#EBD08E; --mark-line:#594E25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1B16; --surface:#26241D; --sunk:#2F2C23; --fg:#F1ECDF; --muted:#B5AFA0; --line:#3E3A2E;
  --accent:#5BC79A; --accent-ink:#0E1A14; --accent-soft:#25382B; --mark:#E8C547; --rec:#FF7A63; --warn-bg:#3A3122; --warn-fg:#EBD08E; --mark-line:#594E25; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;display:flex;flex-direction:column}
button,textarea{font:inherit;color:inherit}
textarea:placeholder-shown,input:not([dir="ltr"]):not([type=password]):not([type=checkbox]):not([type=radio]):placeholder-shown{direction:rtl;text-align:right}
/* the placeholder is ink-muted (DESIGN.md), never the browser's own grey (#757575: 3.74:1 on the dark paper): 5.74:1 by day, 7.89:1 at night on paper */
::placeholder{color:var(--muted);opacity:1}

[hidden]{display:none!important}
header{position:relative;display:flex;flex-wrap:nowrap;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
header b{font-size:15px}
/* one fixed row: a long course name is cut with an ellipsis, the star and the menu never move down */
#lec{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:700;color:var(--muted);display:block}
#lec::before{content:"";display:inline-block;vertical-align:middle;margin-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--line)}
body.on #lec{color:var(--fg)}
body.on #lec::before{background:var(--rec)}
@media (prefers-reduced-motion:no-preference){body.on #lec::before{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}
.hb{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:none;border-radius:10px;padding:0;cursor:pointer;font-size:16px;line-height:1}
.hb:hover{background:var(--accent-soft)}
/* the star says it was marked on the button itself, with the mark colour (the highlighter) for a moment: the eyes stay on the slide */
#markImp.done{background:var(--mark-line);color:var(--fg);border-color:var(--mark-line)}
.hb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}   /* DESIGN.md: focus is a 2px green outline with a 2px offset; the answer button had only the browser's thin default */
/* the ★ is drawn in the highlighter (the only yellow), with a caution-ink outline: the yellow alone is too light on a sheet by day */
#markImp svg{width:19px;height:19px;fill:var(--mark);stroke:var(--warn-fg);stroke-width:1.3;stroke-linejoin:round}
#markImp.done svg{fill:var(--warn-fg)}
/* "⋯": the menu of the less-used things (to the app, stop, close Hevanti); open, it has the green edge */
#menuBtn svg{width:18px;height:18px;fill:currentColor}
#menuBtn[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
#menu{position:absolute;top:calc(100% + 4px);left:8px;z-index:6;min-width:min(250px,calc(100% - 16px));max-width:calc(100% - 16px);padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:2px}
#menu .mi{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;border:1.5px solid transparent;background:none;border-radius:10px;padding:8px 12px;min-height:40px;font:inherit;font-size:15px;font-weight:700;color:var(--fg);text-align:start;cursor:pointer}
#menu .mi svg{flex:none;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
#menu .mi svg.solid{fill:currentColor;stroke:none}
#menu .mi:hover,#menu .mi:focus{background:var(--accent-soft);border-color:var(--accent)}   /* the item with the focus is lit, as the one under the pointer (it is the first one when the menu opens) */
#menu .sep{height:1px;margin:4px 6px;background:var(--line)}
/* the red items keep their red on the sheet, never on the soft green (red on it was 4.16:1) */
#menu .mi.danger,#stopBtn.confirm{color:var(--rec)}
#menu .mi.danger:hover,#menu .mi.danger:focus,#stopBtn.confirm,#stopBtn.confirm:hover{background:var(--surface);border-color:var(--rec)}
#stopBtn.confirm{font-weight:800}
#quitBtn.confirm{font-weight:800}
.miss{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px 0;font-size:14px;color:var(--muted)}
.miss button{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:1px 11px;cursor:pointer;font-size:14px;font-weight:600}
.miss button:hover{background:var(--accent-soft)}
#lag{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--warn-bg);color:var(--warn-fg);font-size:14px;line-height:1.4;font-weight:700;white-space:nowrap;align-self:center}   /* in the row of "תשובה כאן", to its left, a caution pill: never green */
#lag svg{flex:none;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#lagHint{flex:1 1 100%;margin:0;color:var(--muted);font-size:14px;line-height:1.45}
#short{margin:14px 10px;padding:18px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-wrap:wrap;gap:10px}
#short b,#short p{flex:1 1 100%}
#short b{font-size:18px}
#short p{margin:0;color:var(--muted);font-size:15px}
#short button{flex:1 1 130px;border:1.5px solid var(--line);background:none;color:var(--fg);border-radius:12px;padding:8px 14px;min-height:40px;font-size:15px;font-weight:600;cursor:pointer}
#short button:hover{background:var(--accent-soft)}
#saved{margin:14px 10px;padding:18px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
#saved .tick{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px;font-weight:800}
#saved b{font-size:18px}
#saved p{margin:0;color:var(--muted);font-size:15px}
#saved button{border:1.5px solid var(--accent);background:none;color:var(--accent);border-radius:12px;padding:8px 14px;min-height:40px;font-size:15px;font-weight:600;cursor:pointer}
#saved button:hover{background:var(--accent-soft)}
#sug{margin:8px 10px 0;padding:8px 10px;border-radius:10px;background:var(--sunk);color:var(--fg);font-size:14px;line-height:1.45;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#sug span{flex:1 1 150px}
#sug button{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:4px 14px;min-height:36px;cursor:pointer;font-size:14px;font-weight:600}
#sug button:hover{background:var(--accent-soft)}
#note{margin:8px 10px 0;padding:6px 10px;border-radius:10px;background:var(--sunk);color:var(--muted);font-size:14px;line-height:1.45}
.miss button{padding:4px 14px;min-height:36px}   /* a trackpad in a dark lecture hall: 36 px high, 8 px apart, so 7 is not pressed for 3 */
#box{flex:1;min-height:0;padding:8px 10px 10px}
#box.askp{display:flex;flex-direction:column;height:100%;gap:8px}
#box.askp .conv{flex:1;min-height:0;max-height:none}
#box.askp .head{display:none}
#box.askp textarea{font-size:17px;padding:10px 12px;min-height:3.6em;border-radius:12px}
#box.askp .ais button.here{flex:1 1 55%;min-width:0;padding:11px 18px;font-size:16px;border-radius:12px;text-align:center}   /* the answer button takes the width of the row; the lag warning, when there is one, takes its own at the left */
#toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 20px);width:max-content;box-sizing:border-box;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18);padding:9px 16px;border-radius:12px;font-size:15px;line-height:1.4;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast .star{display:inline-block;background:var(--mark-line);color:var(--fg);border-radius:6px;padding:0 7px;margin-inline-end:8px}   /* the ★ is the only yellow: the highlighter of a mark */
#toast.on{opacity:1}
/* motion (2.22): short and quiet; the system setting and the app's "no animations and motion" turn it off */
#saved .tick svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){
  #toast.on .star{animation:hv-pop .5s cubic-bezier(.2,.8,.2,1) .05s backwards}
  #markImp.done{animation:hv-pop .5s cubic-bezier(.2,.8,.2,1)}
  #saved:not([hidden]) .tick{animation:hv-pop .45s cubic-bezier(.2,.8,.2,1) backwards}

<script>
// counts in Hebrew: "דקה אחת", "שתי דקות", "5 דקות" - never "1 דקות"
"use strict";

const $ = s => document.querySelector(s);

// mark this moment of the lecture with ★ (the course page then lists it)

$("#markImp").addEventListener("click", () => mark());

document.addEventListener("pointerdown", e => { if (!menu.hidden && !menu.contains(e.target) && !menuBtn.contains(e.target)) closeMenu(false); });
// "שיחה חדשה": the questions and answers of this box are cleared (what "more details" and the next question carry is cleared too); the answers stay in the lecture's folder
$("#miNew").addEventListener("click", () => { if (box && box.reset) box.reset(); closeMenu(false); if (box) box.focus(); toast("שיחה חדשה: אפשר לשאול מחדש."); });

let appOpening = false;   // (a double click must not send "show_app" and close the window twice)
$("#miApp").addEventListener("click", async () => {
  if (appOpening) return; appOpening = true;

  closeMenu(false);

// stop from here: the first press asks (3 seconds), the second stops; the lecture is saved, and a card says so
const stopBtn = $("#stopBtn");
function stopReset() { clearTimeout(stopTimer); stopBtn.classList.remove("confirm"); setItemText(stopBtn, stopBtn.dataset.mode === "start" ? "התחלת הרצאה חדשה" : "עצירת הקלטה"); }
function setItemText(b, t) { b.firstChild.nodeValue = t; }   // (the text node before the icon)
stopBtn.addEventListener("click", async () => {
  if (stopBtn.dataset.mode === "start") {   // no lecture: the same place starts a new one (the quick-start window; closing it closes only itself)
    closeMenu(false);
    try { await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "quick_new"})}); } catch (e) {}
    return;
  }

    stopTimer = setTimeout(stopReset, 3000);
    return;
  }
  stopReset(); closeMenu(false);
  const sk = BZMAsk.stopKind(curS);   // (the same rule as in the app: ask.js)
  if (sk.kind === "cancel") { await doStop(true); toast("בוטל. לא נשמר כלום."); return; }

let discardedHere = false;   // (the student chose to delete it: no "saved" card for this lecture, whatever the server says)
async function doStop(discard) {

  setLec(discard ? "עוצר ומוחק..." : "עוצר ושומר...");

}
$("#shortDel").addEventListener("click", async () => { await doStop(true); toast("ההרצאה נעצרה ונמחקה."); });
$("#shortSave").addEventListener("click", () => doStop(false));
// close Hevanti for good, from here: the first press asks (3 seconds), the second closes (a running lecture is stopped and saved first)
const quitBtn = $("#quitBtn"); let quitTimer = 0;
function quitReset() { clearTimeout(quitTimer); quitBtn.classList.remove("confirm"); setItemText(quitBtn, "סגירת הבנתי"); }
quitBtn.addEventListener("click", async () => {
  if (!quitBtn.classList.contains("confirm")) {
    quitBtn.classList.add("confirm"); setItemText(quitBtn, live ? "לסגור? ההרצאה תישמר" : "לסגור את הבנתי?");
    quitTimer = setTimeout(quitReset, 3000);
    return;
  }
  clearTimeout(quitTimer); quitBtn.disabled = true; setItemText(quitBtn, live ? "שומר וסוגר..." : "סוגר...");
  try { await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "quit"})}); } catch (e) {}
});
$("#savedClose").addEventListener("click", () => { savedGone = $("#saved").dataset.f || ""; drawSaved(null); hide(); });
$("#savedOpen").addEventListener("click", async () => {
  const f = $("#saved").dataset.f; savedGone = f || ""; drawSaved(null);
  try { await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "open_lecture", f})}); } catch (e) {}
  hide();
});
function drawSaved(s) {   // the lecture this window saw running is saved: a card instead of the question box
  let sv = s && s.done && s.saved && sawLive && !discardedHere ? s.saved : null;
  if (sv && sv.f === savedGone) sv = null;   // (closed or opened already: it does not come back every time the window opens)
  if (sv && savedFor !== sv.f) savedFor = sv.f;
  const show = !!sv && savedFor === sv.f && !live;
  $("#saved").hidden = !show;
  if (show) {
    $("#saved").dataset.f = sv.f;
    $("#savedInfo").textContent = (sv.course && sv.course !== "ללא קורס" ? "בקורס \"" + sv.course + "\", " : "") + heN(sv.minutes, "דקה אחת", "שתי דקות", "דקות") + ", " + sv.slides + (sv.slides === 1 ? " שקף" : " שקפים") + ".";
    $("#note").hidden = true; $("#miss").hidden = true; $("#sug").hidden = true; $("#box").hidden = true;
  } else { $("#box").hidden = false; }
}
$("#sugYes").addEventListener("click", async () => {   // the lecture moves to that course when it is stopped and saved
  const c = $("#sug").dataset.course; $("#sug").hidden = true;
  let r; try { r = await (await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "set_lecture_course", course: c})})).json(); } catch (e) { r = {ok: false}; }
  toast(r.ok ? "ההרצאה תועבר לקורס \"" + c + "\" כשתיעצר ותישמר." : (r.error || "לא הצלחתי להעביר."));
});
$("#sugNo").addEventListener("click", () => { $("#sug").hidden = true; fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "suggest_dismiss"})}).catch(() => {}); });
let box = null, markedHere = false, lastKey = "";
if (window.BZMAsk) box = BZMAsk.mount($("#box"), {compact: true, title: "שאלה", placeholder: "מה לא ברור? (Enter לשליחה)",
  context: q => q,   // (for "answer here" Hevanti builds the context itself)
  // what is copied to ChatGPT / Gemini / Claude: the question with the last minutes of the lecture, built by Hevanti like the page's own
  copyContext: async (q, minutes) => {   // (when Hevanti cannot answer, this throws and the bare question is copied: a copy never fails for that)
    const r = await fetch("/api/mini_context", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"},
      body: JSON.stringify({question: q, minutes: minutes || 0}), signal: AbortSignal.timeout(8000)});
    const d = await r.json();
    if (!r.ok || typeof d.context !== "string" || !d.context) throw new Error("no context");

  },
  toast, hasImage: () => !!shot, image: () => shot, where: () => "mini",
  onKey: async () => {   // "paste a key": the app opens on the settings (the key is the first tab); this window steps aside
    try { await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-BZM": "1"}, body: JSON.stringify({action: "open_settings"})}); } catch (e) {}
    hide();
  },
  at: () => new Date().toLocaleTimeString("he-IL")});
// "what I missed": a ready question about the last 3 / 7 / 15 minutes (Hevanti sends them with it; see missed_question)
for (const b of document.querySelectorAll("#miss button")) b.addEventListener("click", () => {
  const n = +b.dataset.m;
  if (box) box.ask("פספסתי את " + n + " הדקות האחרונות של ההרצאה. תסכם לי מה נאמר בהן ומה חשוב להבין כדי להמשיך לעקוב.",
    {title: "מה פספסתי ב-" + n + " הדקות האחרונות?", minutes: n});
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  // Esc first takes back what is open (a stop question, "delete?", "close Hevanti?"); only with nothing open does it hide the window
  if (stopBtn.classList.contains("confirm")) { stopReset(); return; }
  if (!$("#short").hidden) { $("#short").hidden = true; pollApp(); return; }
  if (quitBtn.classList.contains("confirm")) { quitReset(); return; }
  if (!menu.hidden) { closeMenu(true); return; }   // (the menu goes first, the window only when nothing is open)
  hide();
});
window.addEventListener("focus", () => { if (box && menu.hidden) box.focus(); });
async function getJson(u) { return (await fetch(u, {cache: "no-store"})).json(); }
async function pollApp() {

    if (d.settings_damaged && d.settings_damaged.n !== lastDamage) { lastDamage = d.settings_damaged.n; toast(d.settings_damaged.msg); }   // (a settings save that failed: said once)

    if (d.run && mine && mine !== "__" + "RUN__" && mine !== d.run) {

    if (d.a11y) a11yView(d.a11y);
    if ("still" in d) document.documentElement.classList.toggle("a-still", !!d.still);   // "no animations and motion" in the app reaches this window too
    live = !!(s && !s.done && (s.kind === "live" || s.kind === "rec"));   // a live lecture, a video, or a recording being watched
    // "הרצאה חיה - <the course>", e.g. "הרצאה חיה - מכניקת מוצקים"
    const kind = live ? (s.kind === "rec" ? "הרצאה מוקלטת" : s.yt ? "סרטון יוטיוב" : "הרצאה חיה") : "";
    setLec(live ? kind + (s.course && s.course !== "ללא קורס" ? " - " + s.course : "") + (s.ready ? "" : " · מתחילה...") : "אין עכשיו הרצאה פעילה");   // (the button is there from the first second; the transcript starts when the model has loaded)
